<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("bc-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") return;
        document.documentElement.setAttribute("data-theme", t);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++)
          metas[i].setAttribute("media", metas[i].getAttribute("data-scheme") === t ? "all" : "not all");
      })();
    </script>
    <meta name="description" content="FlowLens : parcours de 31 509 demandes de prêt du journal public BPI Challenge 2017. Graphe des transitions, variantes, délais et scénario de réduction, calculés dans le navigateur." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>FlowLens · parcours de 31 509 demandes de prêt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
